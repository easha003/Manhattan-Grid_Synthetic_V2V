project:
  experiment: "nyc_osm_generalization"
  description: "Held-out real-map topology; demand must be calibrated separately"

mobility:
  kind: "nyc_osm"
  grid: null
  network_artifact: "artifacts/traces/mobility/nyc/nyc.net.xml"
  step_s: 0.05
  speed_limit_mps: 11.18
  target_densities_veh_per_lane_km: [20.0, 40.0, 60.0]
  density_tolerance_fraction: 0.05
  signal_cycle_s: 90.0
  stagger_signal_offsets: true
  turn_probabilities:
    left: 0.25
    straight: 0.50
    right: 0.25
  straight_heavy_turn_probabilities:
    left: 0.10
    straight: 0.80
    right: 0.10
  warmup_s: 300.0
  trace_duration_s: 900.0
  boundary_arrivals: "poisson"
  vehicle_classes:
    - name: "passenger_car"
      share: 0.90
      length_m: 4.5
      width_m: 1.8
      height_m: 1.5
    - name: "van_suv"
      share: 0.07
      length_m: 5.2
      width_m: 2.0
      height_m: 2.0
    - name: "bus_truck"
      share: 0.03
      length_m: 11.0
      width_m: 2.5
      height_m: 3.25

